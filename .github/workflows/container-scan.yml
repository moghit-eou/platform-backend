name: Container Vulnerability Scanning

on:
  push: # To be removed after testing 
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # weekly SCA scan, every Monday 02:00 UTC
    
jobs:
  sca:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for uploading SCA results to github security
    env:
      IMAGE_NAME: platform-backend:testing

      # SCA / CVE
      TRIVY_IGNOREFILE: .github/scripts/suppress_trivy.yaml
      OSV_IGNOREFILE: .github/scripts/suppress_osv_scanner.toml
      TRIVY_SCA_SARIF_OUTPUT: sca-trivy-container.sarif
      OSV_SCA_SARIF_OUTPUT: sca-osv-container.sarif
      SCA_MERGED_SARIF_OUTPUT: sca-merged-container.sarif

      # SAST /Linting
      OPENGREP_SAST_SARIF_OUTPUT: sast-opengrep-dockerfile.sarif
      HADOLINT_SAST_SARIF_OUTPUT: sast-hadolint-dockerfile.sarif
    
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: '3.14.4'

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Setup tools
        run: bash .github/scripts/setup-tools.sh
      
      - name: Run SAST scanning
        run: python3 .github/scripts/container_scan.py --scan-type sast

      - name: Run SCA scanning
        if: always()
        run: python3 .github/scripts/container_scan.py --scan-type sca --image ${{ env.IMAGE_NAME }}

      - name: Upload Trivy SARIF to GitHub Security tab
        id: upload_trivy
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
        with:
          sarif_file: ${{ env.TRIVY_SARIF_OUTPUT }}
          category: trivy-image

      - name: Upload OSV Scanner SARIF to GitHub Security tab
        id: upload_osv
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
        with:
          sarif_file: ${{ env.OSV_SARIF_OUTPUT }}
          category: osv-scanner-image

      - name: Upload OpenGrep SARIF to GitHub Security tab
        id: upload_opengrep
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
        with:
          sarif_file: ${{ env.OPENGREP_SARIF_OUTPUT }}
          category: opengrep-sast

      - name: Upload merged SARIF as artifact
        if: ${{ always() && steps.upload_trivy.outcome == 'success' && steps.upload_osv.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: merged-sca-sarif
          path: ${{ env.MERGED_SARIF_OUTPUT }}
          retention-days: 30