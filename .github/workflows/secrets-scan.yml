name: Secret Scanning (gitleaks)

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_SARIF_OUTPUT: gitleaks.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install gitleaks
        run: bash ci/setup-tools.sh --install-tool gitleaks

      - name: Install and run gitleaks
        run: >
          gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --report-format sarif --report-path "$GITLEAKS_SARIF_OUTPUT" --redact --verbose

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
        with:
          sarif_file: ${{ env.GITLEAKS_SARIF_OUTPUT }}
          category: gitleaks
